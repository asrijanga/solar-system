name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run size

  captures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The Moon's terrain tiles (SS-10, SS-11b) are built from pinned, checksummed LOLA products
      # whenever the build changes and are never committed: 677 MB gzip-compressed, too large for
      # git. The 5.2 GB of sources are cached; tools/data/download.ts re-verifies each file's
      # SHA-256 either way.
      - uses: actions/cache@v4
        with:
          path: |
            pipeline/.cache/ldem_64_float.img
            pipeline/.cache/ldem512_rows_2560_8704.img
            pipeline/.cache/kaguya_tc_dtm_S09E003S12E006SC.img
            pipeline/.cache/sldem2015_128_60s_60n_000_360_float.img
          key: lola-terrain-${{ hashFiles('tools/terrain/build.ts', 'tools/data/download.ts') }}
          restore-keys: lola-terrain-
      # The built tiles too: they depend only on the build code and the pinned sources above.
      - id: tiles
        uses: actions/cache@v4
        with:
          path: public/terrain
          key: moon-tiles-${{ hashFiles('tools/terrain/**', 'tools/data/download.ts') }}
      - if: steps.tiles.outputs.cache-hit != 'true'
        run: npm run pipeline:tiles
      # The Chromium matching the pinned Playwright, which renders WebGPU on SwiftShader.
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run capture
      - run: npm run capture:diff
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: captures/
          if-no-files-found: ignore

  # Allocation in the frame loop (CLAUDE.md), in parallel with the captures. It renders 1,200
  # frames a run on SwiftShader, about 30 minutes for both runs, so on a pull request it runs only
  # when the per-frame code changed (owner decision, 2026-09-26). Every push to main runs it.
  alloc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: frame
        name: Did the frame code change?
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The checkout is the pull request merged onto its base, so comparing trees with the
          # base gives exactly what the pull request changes.
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          changed=$(git diff --name-only "origin/${{ github.base_ref }}" HEAD -- \
            src/main.ts src/worlds src/ui src/scenes src/core src/gpu tools/perf package.json package-lock.json \
            | grep -v '\.test\.ts$' || true)
          echo "Frame code changed:"
          echo "${changed:-  (nothing: allocation not measured)}"
          echo "changed=$([ -n "$changed" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.frame.outputs.changed == 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.frame.outputs.changed == 'true'
        run: npm ci
      - if: steps.frame.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            pipeline/.cache/ldem_64_float.img
            pipeline/.cache/ldem512_rows_2560_8704.img
            pipeline/.cache/kaguya_tc_dtm_S09E003S12E006SC.img
            pipeline/.cache/sldem2015_128_60s_60n_000_360_float.img
          key: lola-terrain-${{ hashFiles('tools/terrain/build.ts', 'tools/data/download.ts') }}
          restore-keys: lola-terrain-
      - if: steps.frame.outputs.changed == 'true'
        id: tiles
        uses: actions/cache@v4
        with:
          path: public/terrain
          key: moon-tiles-${{ hashFiles('tools/terrain/**', 'tools/data/download.ts') }}
      - if: steps.frame.outputs.changed == 'true' && steps.tiles.outputs.cache-hit != 'true'
        run: npm run pipeline:tiles
      - if: steps.frame.outputs.changed == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.frame.outputs.changed == 'true'
        run: npm run alloc
      - if: steps.frame.outputs.changed == 'true'
        run: npm run alloc -- orbit=7 relief=off
      # Mars's page, its terrain from Mars's own data site (docs/stories/SS-14.md, W7).
      - if: steps.frame.outputs.changed == 'true'
        run: npm run alloc -- world=mars
      - uses: actions/upload-artifact@v4
        if: always() && steps.frame.outputs.changed == 'true'
        with:
          name: alloc
          path: captures/alloc*.json
          if-no-files-found: ignore

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: python -m pip install uv==0.8.17
      - run: npm run pipeline:test
      # Re-derive the committed star data from the pinned, checksummed source. Any difference
      # means the committed binary no longer comes from the script, and fails the build.
      - run: npm run pipeline:stars
      - run: npm run pipeline:ephemeris
      - run: npm run pipeline:ephemeris:mars
      - run: npm run pipeline:ephemeris:mercury
      - run: npm run pipeline:timeline
      - run: npm run pipeline:timeline:mars
      # Phobos's and Deimos's shapes, and where they and the Moon are (docs/stories/SS-14.md, W8).
      - run: npm run pipeline:moons:mars
      # The Hapke parameters are re-derived from the pinned WAC product (1.8 MB), and the albedo
      # calibration from them and the committed texture and mask.
      - run: npm run pipeline:hapke
      - run: npm run pipeline:calibrate
      # Mars's albedo is re-derived from its pinned OMEGA and TES maps and HRSC's 24 colour faces
      # (978 MB, cached; download re-verifies each file's SHA-256 either way).
      - uses: actions/cache@v4
        with:
          path: |
            pipeline/.cache/mars-omega-albedo-r1080.img
            pipeline/.cache/mars-tes-albedo-8ppd.img
            pipeline/.cache/mars-hrsc-*.tif
            pipeline/.cache/hst
          key: mars-albedo-${{ hashFiles('pipeline/mars.py', 'pipeline/mars_omega.py', 'pipeline/mars_hst.py', 'pipeline/hrsc_sources.json', 'pipeline/hst_sources.json') }}
          restore-keys: mars-albedo-
      - run: npm run pipeline:mars
      # Mars's scattering law, fitted to its measured brightness (docs/stories/SS-14.md, W7).
      - run: npm run pipeline:mars:photometry
      # The Moon texture's 4.25 GB source is too large to fetch on every run; it is checked
      # against the IAU Gazetteer by pipeline:test instead, and rebuilt locally by pipeline:moon.
      # Any difference is also reported as annotations (file names, then the first changed lines),
      # which can be read without the job log.
      - run: |
          paths="public/data/stars public/data/moon/ephemeris.json public/data/moon/timeline.json public/data/moon/timeline.bin test/fixtures/moon-timeline-truth.json test/fixtures/mars-timeline-truth.json test/fixtures/mars-moons-truth.json public/data/mars public/data/mercury public/data/moon/albedo.json public/data/moon/hapke.json public/data/moon/hapke.bin"
          if ! git diff --exit-code -- $paths; then
            git diff --stat -- $paths | head -5 | while read -r line; do echo "::error::differs: $line"; done
            git diff --unified=0 --no-color -- $paths | grep -E '^[-+][^-+]' | head -4 | cut -c1-300 | while read -r line; do echo "::error::$line"; done
            exit 1
          fi
