name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run size

  captures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The Chromium matching the pinned Playwright, which renders WebGPU on SwiftShader.
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run capture
      - run: npm run capture:diff
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: captures/
          if-no-files-found: ignore
