name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run size

  captures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The Chromium matching the pinned Playwright, which renders WebGPU on SwiftShader.
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run capture
      - run: npm run capture:diff
      - run: npm run alloc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: captures/
          if-no-files-found: ignore

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: python -m pip install uv==0.8.17
      - run: npm run pipeline:test
      # Re-derive the committed star data from the pinned, checksummed source. Any difference
      # means the committed binary no longer comes from the script, and fails the build.
      - run: npm run pipeline:stars
      - run: git diff --exit-code -- public/data/stars
