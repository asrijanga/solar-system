name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The Moon's terrain tiles (SS-10) are built from pinned, checksummed LOLA products on
      # every run and never committed: 485 MB, too large for git. The 2.4 GB of sources are
      # cached; tools/data/download.ts re-verifies each file's SHA-256 either way.
      - uses: actions/cache@v4
        with:
          path: |
            pipeline/.cache/ldem_64_float.img
            pipeline/.cache/ldem512_rows_2560_8704.img
            pipeline/.cache/kaguya_tc_dtm_S09E003S12E006SC.img
          key: lola-terrain-${{ hashFiles('tools/terrain/build.ts', 'tools/data/download.ts') }}
          restore-keys: lola-terrain-
      - run: npm run pipeline:tiles
      # Nothing deploys that would fail CI, captures included.
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run capture
      - run: npm run capture:diff
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
