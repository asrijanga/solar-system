<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Solar System</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #e4e5e8;
        font:
          16px/1.6 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      #app {
        display: block;
        width: 100%;
        height: 100%;
      }
      #unsupported {
        box-sizing: border-box;
        max-width: 560px;
        margin: 0 auto;
        padding: 20vh 16px 0;
      }
      #unsupported h1 {
        font-size: 1.5rem;
        line-height: 1.3;
        margin: 0 0 12px;
      }
      #unsupported p {
        margin: 0;
        color: #a9adb6;
      }
      #moon-controls {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: max(12px, env(safe-area-inset-bottom));
        max-width: 420px;
        font-size: 13px;
        line-height: 1.4;
        color: #a9adb6;
        pointer-events: none;
      }
      #moon-controls p {
        margin: 0 0 6px;
      }
      #moon-controls a,
      #moon-controls button {
        pointer-events: auto;
        color: #e4e5e8;
      }
      #moon-controls button {
        font: inherit;
        padding: 6px 10px;
        margin: 2px 0 6px;
        background: #1c1f26;
        border: 1px solid #3a3f4a;
        border-radius: 4px;
      }
      #moon-controls button[aria-pressed='true'] {
        border-color: #f0c060;
        color: #f0c060;
      }
      #moon-controls .boost-label {
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <section id="unsupported" hidden>
      <h1></h1>
      <p></p>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
