<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #fbfbfa;
    --surface: #f2f2ef;
    --text: #1c1d1f;
    --muted: #5d6068;
    --border: #dcdcd6;
    --accent: #2f5fa7;
    --code-bg: #ecece8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0f12;
      --surface: #16181d;
      --text: #e4e5e8;
      --muted: #9a9ea8;
      --border: #2a2d34;
      --accent: #8fb4ff;
      --code-bg: #1c1f25;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header.site {
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  header.site .inner {
    max-width: 1180px;
    margin: 0 auto;
    padding: 12px 16px;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    align-items: baseline;
  }
  header.site a { color: var(--muted); text-decoration: none; font-size: 0.95rem; }
  header.site a[aria-current="page"] { color: var(--text); font-weight: 600; }
  .layout {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 16px 80px;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 48px;
  }
  @media (min-width: 1000px) {
    .layout.has-toc { grid-template-columns: 240px minmax(0, 760px); }
  }
  .toc { font-size: 0.9rem; }
  .toc p { margin: 32px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.75rem; }
  .toc ol { list-style: none; margin: 0; padding: 0; }
  .toc li { margin: 0; }
  .toc a { display: block; padding: 4px 0; color: var(--muted); text-decoration: none; }
  .toc a:hover { color: var(--accent); }
  @media (min-width: 1000px) {
    .toc { position: sticky; top: 0; max-height: 100vh; overflow-y: auto; padding-bottom: 32px; }
  }
  @media (max-width: 999px) {
    .toc { border-bottom: 1px solid var(--border); padding-bottom: 16px; }
  }
  main { min-width: 0; }
  h1 { font-size: 2rem; line-height: 1.2; margin: 32px 0 8px; }
  h2 { font-size: 1.45rem; margin: 56px 0 12px; padding-top: 8px; border-top: 1px solid var(--border); }
  h3 { font-size: 1.12rem; margin: 36px 0 8px; }
  h1, h2, h3 { position: relative; scroll-margin-top: 16px; }
  .anchor { position: absolute; left: -1.1em; color: var(--muted); text-decoration: none; opacity: 0; }
  h1:hover .anchor, h2:hover .anchor, h3:hover .anchor { opacity: 1; }
  p, ul, ol { margin: 0 0 14px; }
  a { color: var(--accent); }
  code {
    font: 0.88em/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--code-bg);
    padding: 1px 5px;
    border-radius: 4px;
  }
  pre { background: var(--code-bg); padding: 12px 14px; border-radius: 6px; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  pre.mermaid { background: var(--surface); text-align: center; }
  .table-wrap { overflow-x: auto; margin: 0 0 18px; border: 1px solid var(--border); border-radius: 6px; }
  table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
  @media (max-width: 640px) { table { min-width: 600px; } }
  th, td { text-align: left; vertical-align: top; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  th { background: var(--surface); font-weight: 600; white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  li:has(> input[type="checkbox"]) { list-style: none; margin-left: -1.3em; }
  input[type="checkbox"] { margin-right: 8px; }
  hr { border: 0; border-top: 1px solid var(--border); margin: 32px 0; }
</style>
</head>
<body>
<header class="site"><div class="inner">{{nav}}</div></header>
<div class="layout{{layoutClass}}">
{{toc}}
<main>
{{body}}
</main>
</div>
<script>
  if (document.querySelector('pre.mermaid')) {
    const s = document.createElement('script');
    s.src = 'vendor/mermaid.min.js';
    s.onload = () => {
      const dark = matchMedia('(prefers-color-scheme: dark)').matches;
      mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'neutral' });
      mermaid.run({ querySelector: 'pre.mermaid' });
    };
    document.body.appendChild(s);
  }
</script>
</body>
</html>
